services:
  nginx:
    image: nginx:1.25-alpine
    container_name: lab5_nginx
    ports:
      - '8085:80'
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./src
    container_name: lab5_php
    volumes:
      - ./src:/var/www/html
