<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Специалисты - МЦ «Здоровье+»</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="page">
    <header class="header">
      <div class="header__container">
        <div class="header__brand">
          <img src="img/logo.svg" alt="Логотип" class="header__logo" />
          <span class="header__title">МЦ «Здоровье+»</span>
        </div>

        <nav class="nav">
          <a class="nav__link" href="index.html">Новости</a>
          <a class="nav__link" href="services.html">Услуги</a>
          <a class="nav__link nav__link--active" href="doctors.html">Специалисты</a>
          <a class="nav__link" href="schedule.html">Расписание</a>
          <a class="nav__link" href="contacts.html">Контакты</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <section class="section section--light" id="doctors">
        <h2 class="section__title">Наши специалисты</h2>

        <div class="doctors">
          <div class="doctor-card">
            <img src="img/doctor-1.jpg" class="doctor-card__photo" alt="Иванова И.И." />
            <h3 class="doctor-card__name">Иванова И.И.</h3>
            <p class="doctor-card__specialty">Терапевт</p>
          </div>

          <div class="doctor-card">
            <img src="img/doctor-2.jpg" class="doctor-card__photo" alt="Петрова А.В." />
            <h3 class="doctor-card__name">Петрова А.В.</h3>
            <p class="doctor-card__specialty">Кардиолог</p>
          </div>

          <div class="doctor-card">
            <img src="img/doctor-3.jpg" class="doctor-card__photo" alt="Сидорова Д.М." />
            <h3 class="doctor-card__name">Сидорова Д.М.</h3>
            <p class="doctor-card__specialty">Невролог</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">© 2026 Медицинский центр «Здоровье+»</p>
    </footer>
