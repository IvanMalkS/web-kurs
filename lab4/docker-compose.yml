services:
  nginx:
    image: nginx:1.25-alpine
    container_name: lab4_nginx
    ports:
      - '8084:80'
    volumes:
      - ./src:/var/www/html
      - ./data:/var/www/data
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ../lab3/php
    container_name: lab4_php
    volumes:
      - ./src:/var/www/html
      - ./data:/var/www/data

  parser:
    build: ./python
    container_name: lab4_parser
    volumes:
      - .:/app
    working_dir: /app
