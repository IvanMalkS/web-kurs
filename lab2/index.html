<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Калькулятор систем счисления</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="page">
    <main class="calculator">
      <h1 class="calculator__title">Перевод систем счисления</h1>

      <div class="calculator__controls">
        <div class="select">
          <label class="select__label">Из системы</label>
          <select id="fromBase" class="select__field"></select>
        </div>

        <div class="select">
          <label class="select__label">В систему</label>
          <select id="toBase" class="select__field"></select>
        </div>
      </div>

      <input type="text" class="calculator__display" id="display" readonly placeholder="Введите число" />

      <div class="keyboard">
        <button class="keyboard__key" data-value="0">0</button>
        <button class="keyboard__key" data-value="1">1</button>
        <button class="keyboard__key" data-value="2">2</button>
        <button class="keyboard__key" data-value="3">3</button>
        <button class="keyboard__key" data-value="4">4</button>
        <button class="keyboard__key" data-value="5">5</button>
        <button class="keyboard__key" data-value="6">6</button>
        <button class="keyboard__key" data-value="7">7</button>
        <button class="keyboard__key" data-value="8">8</button>
        <button class="keyboard__key" data-value="9">9</button>
        <button class="keyboard__key" data-value="A">A</button>
        <button class="keyboard__key" data-value="B">B</button>
        <button class="keyboard__key" data-value="C">C</button>
        <button class="keyboard__key" data-value="D">D</button>
        <button class="keyboard__key" data-value="E">E</button>
        <button class="keyboard__key" data-value="F">F</button>
      </div>

      <div class="calculator__actions">
        <button class="button button--primary" id="convert">Перевести</button>
        <button class="button button--secondary" id="clear">Сброс</button>
      </div>
    </main>

    <script src="js/calculator.js"></script>
  </body>
</html>
